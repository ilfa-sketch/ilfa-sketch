name: Update Snake for Faruq

on:
  schedule:
    - cron: "0 0 * * *"   # Update tiap jam 00:00
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Generate Snake
        uses: Platane/snk@master
        with:
          github_user_name: ilfa-sketch  # Ganti dengan username-mu
          svg_output_path: ./snake.svg   # Simpan di root repo
          theme: dark-blue               # Warna biru gelap
        
      - name: Push Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add snake.svg
          git commit -m "Update snake for Faruq"
          git push
